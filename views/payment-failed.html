<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment Failed</title>

    <link
        rel="stylesheet"
        href="/css/payment-result.css"
    >

</head>


<body>

    <main class="payment-result-container">

        <div class="result-card failed-card">

            <div class="result-icon failed-icon">
                !
            </div>


            <h1>
                Payment Failed
            </h1>


            <p id="failedMessage">
                Your payment could not be completed.
            </p>


            <div class="result-info">

                <p>
                    <span>Order ID</span>

                    <strong id="orderId">
                        -
                    </strong>
                </p>


                <p>
                    <span>Payment Status</span>

                    <strong>
                        Failed
                    </strong>
                </p>

            </div>


            <div class="result-actions">

                <a
                    href="#"
                    id="retryPayment"
                >
                    Try Again
                </a>


                <a href="/orders">
                    View My Orders
                </a>


                <a href="/">
                    Continue Shopping
                </a>

            </div>

        </div>

    </main>


    <script
        src="/js/payment-failed.js"
        defer
    ></script>

</body>

</html>
