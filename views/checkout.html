<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/css/checkout.css"
    >

    <title>Checkout</title>
</head>

<body>

    <main class="checkout-container">

        <h1>Checkout</h1>

        <div class="checkout-layout">

            <!-- Customer Information -->
            <section class="checkout-form-section">

                <h2>Customer Information</h2>

                <form id="checkoutForm" novalidate>

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="address">
                            Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            name="address"
                            placeholder="Enter your address"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter your city"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="postalCode">
                            Postal Code
                        </label>

                        <input
                            type="text"
                            id="postalCode"
                            name="postalCode"
                            placeholder="Postal code"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="notes">
                            Additional Notes
                        </label>

                        <textarea
                            id="notes"
                            name="notes"
                            placeholder="Additional notes"
                            rows="4"
                        ></textarea>

                    </div>

                    <div class="payment-method">

    <h2>Payment Method</h2>

    <label class="payment-option">

        <input
            type="radio"
            name="paymentMethod"
            value="COD"
            checked
        >

        <span>
            💵 Cash on Delivery
        </span>

    </label>


    <label class="payment-option">

        <input
            type="radio"
            name="paymentMethod"
            value="Online"
        >

        <span>
            💳 Online Payment
        </span>

    </label>

</div>


                    <button
                        type="submit"
                        id="placeOrderBtn"
                    >
                        Place Order
                    </button>

                </form>

            </section>


            <!-- Order Summary -->
            <section class="order-summary">

                <h2>Order Summary</h2>

                <div id="checkoutItems">
                    Loading...
                </div>

                <div class="summary-total">

                    <span>Total</span>

                    <strong id="checkoutTotal">
                        ₹0
                    </strong>

                </div>

            </section>

        </div>

    </main>


    <script
        src="/js/checkout.js"
        defer
    ></script>

</body>

</html>
