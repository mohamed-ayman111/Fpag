<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment Cancelled</title>

    <link
        rel="stylesheet"
        href="/css/payment-result.css"
    >

</head>


<body>

    <main class="payment-result-container">

        <div class="result-card cancelled-card">

            <div class="result-icon cancelled-icon">
                ×
            </div>


            <h1>
                Payment Cancelled
            </h1>


            <p id="cancelledMessage">
                The payment process was cancelled.
            </p>


            <div class="result-info">

                <p>

                    <span>
                        Order ID
                    </span>

                    <strong id="orderId">
                        -
                    </strong>

                </p>


                <p>

                    <span>
                        Payment Status
                    </span>

                    <strong>
                        Cancelled
                    </strong>

                </p>

            </div>


            <div class="result-actions">

                <a
                    href="#"
                    id="returnPayment"
                >
                    Return to Payment
                </a>


                <a href="/orders">
                    View My Orders
                </a>


                <a href="/">
                    Continue Shopping
                </a>

            </div>

        </div>

    </main>


    <script
        src="/js/payment-cancelled.js"
        defer
    ></script>

</body>

</html>
