<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment Successful</title>

    <link
        rel="stylesheet"
        href="/css/payment-success.css"
    >

</head>


<body>

    <main class="payment-success-container">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>


            <h1>
                Payment Successful
            </h1>


            <p id="successMessage">
                Your payment has been completed successfully.
            </p>


            <p>
                Order ID:
                <strong id="orderId">
                    -
                </strong>
            </p>


            <div class="success-actions">

                <a href="/orders">
                    View My Orders
                </a>


                <a href="/">
                    Continue Shopping
                </a>

            </div>

        </div>

    </main>


    <script
        src="/js/payment-success.js"
        defer
    ></script>

</body>

</html>
