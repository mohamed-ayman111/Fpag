<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="referrer"
        content="no-referrer"
    >

    <title>Reset Password</title>

    <link
        rel="stylesheet"
        href="/css/reset-password.css"
    >

</head>

<body>

    <main class="reset-container">

        <section class="reset-card">

            <h1>Reset Password</h1>

            <p>
                Create a new password for your account.
            </p>

            <form id="resetPasswordForm">

                <div class="field">

                    <label for="password">
                        New Password
                    </label>
                    <div class="password-input-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="64"
                        required
                    >
                    <button 
                    type="button" 
                    class="toggle-password" 
                    data-target="password" 
                    aria-label="Show password" 
                    > 👁 </button>
                    </div>

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>
                    <div class="password-input-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="64"
                        required
                    >
                    <button type="button" 
                    class="toggle-password" 
                    data-target="confirmPassword" 
                    aria-label="Show password" 
                    > 👁 </button>

                </div>
                </div>


                <div class="password-rules">

                    <p>Password requirements:</p>

                    <ul>

                        <li id="lengthRule">
                            At least 8 characters
                        </li>

                        <li id="upperRule">
                            At least one uppercase letter
                        </li>

                        <li id="lowerRule">
                            At least one lowercase letter
                        </li>

                        <li id="numberRule">
                            At least one number
                        </li>

                    </ul>

                </div>


                <button type="submit">
                    Change Password
                </button>

            </form>


            <p
                id="resetMessage"
                class="message"
            ></p>

        </section>

    </main>


    <script
        src="/js/reset-password.js"
        defer
    ></script>
    <script
    src="/js/password-toggle.js"
    defer
></script>

</body>

</html>
